name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_STEAM_RETURN_URL: ${{ vars.VITE_STEAM_RETURN_URL || secrets.VITE_STEAM_RETURN_URL }}
      VITE_STEAM_REALM: ${{ vars.VITE_STEAM_REALM || secrets.VITE_STEAM_REALM }}
      VITE_STEAM_WEB_API_KEY: ${{ vars.VITE_STEAM_WEB_API_KEY || secrets.VITE_STEAM_WEB_API_KEY }}
      VITE_STEAM_API_PROXY: ${{ vars.VITE_STEAM_API_PROXY || secrets.VITE_STEAM_API_PROXY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
