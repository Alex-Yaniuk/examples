name: Frontend PR Verification
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-pr-verification.yml'

jobs:
  verify:
    name: Verify frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_STEAM_RETURN_URL: ${{ vars.VITE_STEAM_RETURN_URL || secrets.VITE_STEAM_RETURN_URL }}
      VITE_STEAM_REALM: ${{ vars.VITE_STEAM_REALM || secrets.VITE_STEAM_REALM }}
      VITE_STEAM_WEB_API_KEY: ${{ vars.VITE_STEAM_WEB_API_KEY || secrets.VITE_STEAM_WEB_API_KEY }}
      VITE_STEAM_API_PROXY: ${{ vars.VITE_STEAM_API_PROXY || secrets.VITE_STEAM_API_PROXY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Cache Playwright browsers
      #   id: cache-playwright-browsers
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/ms-playwright
      #     key: playwright-browsers-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      #     restore-keys: |
      #       playwright-browsers-${{ runner.os }}-

      - name: Run lint
        run: npm run lint

      # - name: Install Playwright browsers
      #   run: npx playwright install chromium --with-deps

      # - name: Run Playwright tests
      #   run: npm run test:e2e

      - name: Run build
        run: npm run build
